name: CodeRoom CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Install Linux Rolldown binding
        run: npm install --no-save --include=optional @rolldown/binding-linux-x64-gnu

      - name: Verify Rolldown native binding
        run: npm ls rolldown @rolldown/binding-linux-x64-gnu --workspace=apps/client

      - name: Run server tests
        run: npm run test --workspace=apps/server

      - name: Build client
        run: npm run build:client

      - name: Build server
        run: npm run build --workspace=apps/server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          tags: coderoom-server:latest